services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
    mem_limit: 512m
    cpus: 0.5

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    mem_limit: 512m
    cpus: 0.5

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    mem_limit: 512m
    cpus: 0.5

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    environment:
      USE_PGBOUNCER: ${USE_PGBOUNCER:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    depends_on:
      - operoz-db
      - operoz-redis
      - operoz-pgbouncer
    mem_limit: 1536m
    cpus: 1.0

  api-chat:
    container_name: api-chat
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api-chat.sh
    env_file:
      - ./apps/api/.env
    environment:
      USE_PGBOUNCER: ${USE_PGBOUNCER:-0}
      GUNICORN_CHAT_WORKERS: ${GUNICORN_CHAT_WORKERS:-8}
      GUNICORN_CHAT_TIMEOUT: ${GUNICORN_CHAT_TIMEOUT:-120}
    depends_on:
      - operoz-db
      - operoz-redis
      - operoz-pgbouncer
    mem_limit: 2g
    cpus: 2.0

  operoz-pgbouncer:
    container_name: operoz-pgbouncer
    image: edoburu/pgbouncer:1.22.1-p0
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@operoz-db:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      - operoz-db
    mem_limit: 128m
    cpus: 0.25

  # Fila unica: celery (default) + automation + automation_email + assistant +
  # assistant-chat. Substitui os antigos worker/automation-worker/
  # automation-email-worker/assistant-worker/assistant-chat-worker (Tier 1 do
  # plano de reducao de containers). beat-worker fica de fora por ser singleton.
  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker-general.sh
    env_file:
      - ./apps/api/.env
    environment:
      GENERAL_WORKER_CONCURRENCY: ${GENERAL_WORKER_CONCURRENCY:-8}
    depends_on:
      - api
      - api-chat
      - operoz-db
      - operoz-redis
      - operoz-mq
    mem_limit: 2g
    cpus: 2.0

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - operoz-db
      - operoz-redis
    mem_limit: 256m
    cpus: 0.25

  migrator:
    container_name: operoz-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - operoz-db
      - operoz-redis
    mem_limit: 512m
    cpus: 0.5

  live:
    container_name: operoz-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    mem_limit: 512m
    cpus: 0.5

  operoz-db:
    container_name: operoz-db
    # pgvector para RAG do assistente Operoz (extensão vector).
    image: pgvector/pgvector:pg15
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    mem_limit: 2g
    cpus: 2.0

  operoz-redis:
    container_name: operoz-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data
    mem_limit: 256m
    cpus: 0.25

  operoz-mq:
    container_name: operoz-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 512m
    cpus: 0.5

  operoz-minio:
    container_name: operoz-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    mem_limit: 512m
    cpus: 0.5

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - api-chat
      - space
      - admin
    mem_limit: 256m
    cpus: 0.25

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
