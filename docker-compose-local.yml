# Nome fixo do project Compose (não depende da pasta "Operis").
# Evita drift operis/operoz e permite `down --remove-orphans` limpar serviços renomeados.
name: operoz

services:
  operoz-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      # Use 16379 on host if another process already binds 6379 (containers still use 6379 internally).
      - "16379:6379"

  operoz-minio:
    image: minio/minio
    restart: unless-stopped
    networks:
      - dev_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9090:9090"

  operoz-db:
    # Imagem com pgvector para RAG do assistente (extensão vector).
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    # Evita "[Errno -2] Name does not resolve" ao contactar SMTP (ex.: Resend) no Docker Desktop Windows.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
      - ./docs:/docs:ro
      - ./templates:/code/templates:ro
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - operoz-db
      - operoz-redis
      - operoz-minio
    environment:
      SKIP_ENV_VAR: "1"
      AWS_S3_ENDPOINT_URL: http://operoz-minio:9000
      USE_MINIO: "1"
      MINIO_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports:
      - "8000:8000"
    mem_limit: 1536m

  # Fila unica: celery (default) + automation + automation_email + assistant.
  # Substitui os antigos worker/automation-worker/automation-email-worker/
  # assistant-worker (Tier 1 do
  # plano de reducao de containers). beat-worker fica de fora por ser singleton.
  # Celery workers default to operoz.settings.production via manage.py — force local
  # settings so ALLOWED_HOSTS / debug SMTP match the API container in this stack.
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker-general.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - operoz-db
      - operoz-redis
    environment:
      SKIP_ENV_VAR: "1"
      DJANGO_SETTINGS_MODULE: operoz.settings.local
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      AWS_S3_ENDPOINT_URL: http://operoz-minio:9000
      USE_MINIO: "1"
      MINIO_PUBLIC_ENDPOINT_URL: http://localhost:9000
      GENERAL_WORKER_CONCURRENCY: ${GENERAL_WORKER_CONCURRENCY:-8}

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - operoz-db
      - operoz-redis
    environment:
      SKIP_ENV_VAR: "1"
      DJANGO_SETTINGS_MODULE: operoz.settings.local
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      AWS_S3_ENDPOINT_URL: http://operoz-minio:9000
      USE_MINIO: "1"
      MINIO_PUBLIC_ENDPOINT_URL: http://localhost:9000

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=operoz.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - operoz-db
      - operoz-redis
      - operoz-minio
    environment:
      SKIP_ENV_VAR: "1"
      AWS_S3_ENDPOINT_URL: http://operoz-minio:9000
      USE_MINIO: "1"
      MINIO_PUBLIC_ENDPOINT_URL: http://localhost:9000

volumes:
  redisdata:
  uploads:
  pgdata:

networks:
  dev_env:
    driver: bridge
