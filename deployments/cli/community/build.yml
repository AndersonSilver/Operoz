services:
  web:
    image: ${DOCKERHUB_USER:-local}/operoz-frontend:${APP_RELEASE:-latest}
    build:
      context: ../../../
      dockerfile: apps/web/Dockerfile.web
      args:
        VITE_ENABLE_BOARDS: "true"

  space:
    image: ${DOCKERHUB_USER:-local}/operoz-space:${APP_RELEASE:-latest}
    build:
      context: ../../../
      dockerfile: apps/space/Dockerfile.space

  admin:
    image: ${DOCKERHUB_USER:-local}/operoz-admin:${APP_RELEASE:-latest}
    build:
      context: ../../../
      dockerfile: apps/admin/Dockerfile.admin

  live:
    image: ${DOCKERHUB_USER:-local}/operoz-live:${APP_RELEASE:-latest}
    build:
      context: ../../../
      dockerfile: apps/live/Dockerfile.live

  api:
    image: ${DOCKERHUB_USER:-local}/operoz-backend:${APP_RELEASE:-latest}
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.api

  proxy:
    image: ${DOCKERHUB_USER:-local}/operoz-proxy:${APP_RELEASE:-latest}
    build:
      context: ../../../apps/proxy
      dockerfile: Dockerfile.ce
